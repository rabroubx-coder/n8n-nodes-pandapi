name: release
# Publishes n8n-nodes-pandapi to npm with provenance (required by n8n for verified community nodes).
# Trigger: push a tag vX.Y.Z matching package.json, or run it by hand.
# Auth: npm Trusted Publishing (OIDC): npmjs.com > n8n-nodes-pandapi > Settings > Trusted publishers >
# GitHub Actions, owner rabroubx-coder, repo n8n-nodes-pandapi, workflow release.yml. No token needed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: 'https://registry.npmjs.org', cache: npm }
      - name: npm with trusted publishing support (11.5.1+)
        run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Version must match the tag
        run: |
          v=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME}" = "v$v" || [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] || { echo "tag ${GITHUB_REF_NAME} != v$v"; exit 1; }
          if npm view "n8n-nodes-pandapi@$v" version >/dev/null 2>&1; then echo "n8n-nodes-pandapi@$v is already on npm"; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: Publish
        if: env.SKIP != '1'
        run: npm publish --provenance --access public
